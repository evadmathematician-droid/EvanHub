name: evangelistglobal
description: "Evangelist Global — multi-tenant school management SaaS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5

  # Navigation
  go_router: ^16.0.0

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.1.0
  firebase_database: ^12.0.0
  http: ^1.2.0
  firebase_analytics: ^12.5.0
  firebase_performance: ^0.11.5

  # Utilities
  intl: ^0.19.0
  file_picker: ^13.1.0
  cached_network_image: ^3.4.1
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  archive: ^3.6.1
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.3.4
  connectivity_plus: ^7.3.1
  flutter_image_compress: ^2.5.1
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  firebase_remote_config: ^6.7.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.5
  in_app_update: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Logo on the mandatory-update screen (lib/force_update).
    - assets/icon/app_icon.png

# App icon. Source: assets/icon/profile.jpeg (the EvanHub logo), converted to
# 1024x1024 PNGs. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  min_sdk_android: 23
  # Android 8+ adaptive icon: logo shrunk into the safe zone on white, so
  # round/squircle launcher masks never crop it.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#0175C2"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
